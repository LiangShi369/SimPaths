# Age-related public health spending experiment, using the unscaled (s=1)
# OBR-derived input/age_health_cost_profile.xlsx in real 2015 pounds.
# Run with: -config age_related_health_costs_2060.yml
# The first health-spending calculation is for 2028 (2028-29); earlier
# simulation years initialise and evolve the population.

maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 606
startYear: 2019
endYear: 2029
popSize: 25000

model_args:
  alignPopulation: true
  alignCohabitation: true
  alignFertility: true
  # Exact field names in SimPathsModel; these are instance int fields.
  FERTILITY_ALIGNMENT_END_YEAR: 2060
  PARTNERSHIP_ALIGNMENT_END_YEAR: 2060

collector_args:
  # Step 5 calculates annual results in memory; CSV exports follow in Step 6.
  persistHealthSpendingStatistics: true
