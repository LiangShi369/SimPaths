# Short integration scenario for the age-related health-spending outputs.
# Requires the usual SimPaths input database. It covers the 2028 baseline
# and one later year without changing the production 2060 experiment file.

maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 606
startYear: 2019
endYear: 2029
popSize: 20000

model_args:
  alignPopulation: true
  alignCohabitation: true
  alignFertility: true
  FERTILITY_ALIGNMENT_END_YEAR: 2029
  PARTNERSHIP_ALIGNMENT_END_YEAR: 2029

collector_args:
  persistHealthSpendingStatistics: true
  persistPersons: false
  persistBenefitUnits: false
  persistHouseholds: false
