# Short check of natural and alignment deaths with pension transfers enabled.
maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 606
startYear: 2021
endYear: 2022
popSize: 5000

parameter_args:
  populationProjectionFilename: align_popProjections.xlsx

model_args:
  bequestSyntheticRecipientCount: 2
  transferDcPensionAtDeath: true
  alignPopulation: true
  alignCohabitation: false
  alignFertility: false
